name: x5-support

# ─────────────────────────────────────────────────────────────────────────────
# Базовый стек: приложение + Postgres + Redis + экспортеры метрик.
# Наблюдаемость подключается отдельным файлом:
#   docker compose -f docker-compose.yml -f docker-compose.observability.yml up -d
# ─────────────────────────────────────────────────────────────────────────────

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  app:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    image: x5-support-app:local
    container_name: x5-support-app
    restart: unless-stopped
    ports:
      - "${BIND_ADDR:-127.0.0.1}:${APP_PORT:-8080}:8080"
    environment:
      TZ: ${TZ:-Europe/Moscow}
    networks:
      - backend
      - monitoring
    logging: *default-logging
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/healthz"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s

  migrate:
    build: ./backend
    image: x5-support-api:local
    command: ["migrate"]
    environment: &support-env
      DATABASE_URL: postgresql://${POSTGRES_USER:-x5}:${POSTGRES_PASSWORD:-x5_local_password}@postgres:5432/${POSTGRES_DB:-x5_support}?sslmode=disable
      HTTP_ADDR: :8080
      DEBUG_RESET: ${DEBUG_RESET:-0}
      TZ: ${TZ:-Europe/Moscow}
    depends_on:
      postgres: { condition: service_healthy }
    networks: [backend]
    logging: *default-logging

  backend:
    build: ./backend
    image: x5-support-api:local
    container_name: x5-support-backend
    command: ["api"]
    restart: unless-stopped
    environment: *support-env
    depends_on:
      migrate: { condition: service_completed_successfully }
    networks: [backend, monitoring]
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/healthz"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s
    logging: *default-logging

  notifications:
    build: ./backend
    image: x5-support-api:local
    container_name: x5-support-notifications
    command: ["notifications"]
    restart: unless-stopped
    environment: *support-env
    depends_on:
      migrate: { condition: service_completed_successfully }
    networks: [backend, monitoring]
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/healthz"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s
    logging: *default-logging

  postgres:
    image: postgres:16-alpine
    container_name: x5-support-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-x5_support}
      POSTGRES_USER: ${POSTGRES_USER:-x5}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-x5_local_password}
      TZ: ${TZ:-Europe/Moscow}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./infra/postgres/init:/docker-entrypoint-initdb.d:ro
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    networks:
      - backend
      - monitoring
    logging: *default-logging
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-x5} -d ${POSTGRES_DB:-x5_support}"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: x5-support-redis
    restart: unless-stopped
    command:
      - redis-server
      - --appendonly
      - "yes"
      - --maxmemory
      - "256mb"
      - --maxmemory-policy
      - allkeys-lru
    volumes:
      - redisdata:/data
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    networks:
      - backend
      - monitoring
    logging: *default-logging
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 10

  postgres-exporter:
    image: prometheuscommunity/postgres-exporter:v0.16.0
    container_name: x5-support-postgres-exporter
    restart: unless-stopped
    environment:
      DATA_SOURCE_NAME: "postgresql://${POSTGRES_USER:-x5}:${POSTGRES_PASSWORD:-x5_local_password}@postgres:5432/${POSTGRES_DB:-x5_support}?sslmode=disable"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - backend
      - monitoring
    logging: *default-logging

  redis-exporter:
    image: oliver006/redis_exporter:v1.62.0
    container_name: x5-support-redis-exporter
    restart: unless-stopped
    environment:
      REDIS_ADDR: redis://redis:6379
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - backend
      - monitoring
    logging: *default-logging

networks:
  backend:
  monitoring:
  edge:

volumes:
  pgdata:
  redisdata:
