<!doctype html>
<html lang="ru" data-accent="violet" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <title>Орбита — диспетчерская продуктовой команды</title>
    <meta name="description" content="Продуктовая аналитика, метрики и здоровье релизов в одном окне. Лендинг в виде рабочего дашборда." />
    <script>
      (function () {
        try {
          var saved = localStorage.getItem("orbita-theme");
          var theme = saved || "light";
          document.documentElement.dataset.theme = theme;
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
