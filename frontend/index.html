<!doctype html>
<html lang="ru" data-accent="x5" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <title>X5 — Сервис заявок поддержки</title>
    <meta name="description" content="Создавайте заявки, общайтесь с поддержкой и следите за решением ваших вопросов." />
  </head>
  <body>
    <script>
      (function () {
        try {
          var saved = localStorage.getItem("orbita-theme");
          if (saved === "dark" || saved === "light") document.documentElement.dataset.theme = saved;
        } catch (e) {}
      })();
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
