# Изолированные имена контейнеров для локального демо.
# Позволяет держать демо рядом с обычным dev-стеком и не конфликтовать.
services:
  app:
    container_name: x5-support-demo-app
  migrate:
    container_name: x5-support-demo-migrate
  backend:
    container_name: x5-support-demo-backend
  notifications:
    container_name: x5-support-demo-notifications
  postgres:
    container_name: x5-support-demo-postgres
  postgres-exporter:
    container_name: x5-support-demo-postgres-exporter
