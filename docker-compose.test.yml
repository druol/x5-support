name: x5-support-tests
services:
  postgres-test:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: test
      POSTGRES_PASSWORD: test-only
      POSTGRES_DB: support_test
    tmpfs: [/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U test -d support_test"]
      interval: 2s
      timeout: 2s
      retries: 20
  tests:
    build:
      context: ./backend
      target: test
    environment:
      TEST_DATABASE_URL: postgres://test:test-only@postgres-test:5432/support_test?sslmode=disable
    depends_on:
      postgres-test: { condition: service_healthy }
