# ─────────────────────────────────────────────────────────────────────────────
# Прод-профиль: Caddy на 80/443 с автоматическим HTTPS, приложение наружу не
# торчит (только 127.0.0.1). Запуск на сервере:
#   DOMAIN=app.example.ru docker compose \
#     -f docker-compose.yml -f docker-compose.observability.yml \
#     -f docker-compose.prod.yml up -d --build
# ─────────────────────────────────────────────────────────────────────────────

name: x5-support

services:
  app:
    # Наружу отдаёт Caddy; прямой порт — только для отладки на localhost.
    ports: !override
      - "127.0.0.1:${APP_PORT:-8080}:8080"

  pgadmin:
    image: dpage/pgadmin4:8
    container_name: x5-support-pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL:-admin@example.com}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:-change-me}
      PGADMIN_CONFIG_SERVER_MODE: "True"
      PGADMIN_CONFIG_MASTER_PASSWORD_REQUIRED: "False"
    volumes:
      - ./infra/pgadmin/servers.prod.json:/pgadmin4/servers.json:ro
      - pgadmindata:/var/lib/pgadmin
    ports:
      - "127.0.0.1:${PGADMIN_PORT:-5050}:80"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - monitoring
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  caddy:
    image: caddy:2.9-alpine
    container_name: x5-support-edge
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      DOMAIN: ${DOMAIN:?Задайте DOMAIN в .env — например, app.example.ru}
      ACME_EMAIL: ${ACME_EMAIL:-admin@example.ru}
    volumes:
      - ./infra/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - ./certs:/certs:ro
      - caddydata:/data
      - caddyconfig:/config
    depends_on:
      - app
    networks:
      - edge
      - backend

volumes:
  caddydata:
  caddyconfig:
