global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    stack: orbita
    env: local

rule_files:
  - /etc/prometheus/rules/*.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: node
    static_configs:
      - targets: ["node-exporter:9100"]
        labels:
          service: host

  # Метрики Caddy: запросы, коды ответов, латентность.
  - job_name: app
    metrics_path: /metrics
    static_configs:
      - targets: ["app:2019"]
        labels:
          service: app

  # Local ticket-stack jobs; production historical monitoring was not changed or reloaded.
  - job_name: backend
    metrics_path: /metrics
    static_configs:
      - targets: ["backend:8080"]
        labels:
          service: backend

  - job_name: notifications
    metrics_path: /metrics
    static_configs:
      - targets: ["notifications:8080"]
        labels:
          service: notifications

  - job_name: postgres
    static_configs:
      - targets: ["postgres-exporter:9187"]
        labels:
          service: postgres

  - job_name: redis
    static_configs:
      - targets: ["redis-exporter:9121"]
        labels:
          service: redis

  - job_name: loki
    static_configs:
      - targets: ["loki:3100"]
        labels:
          service: loki

  - job_name: grafana
    static_configs:
      - targets: ["grafana:3000"]
        labels:
          service: grafana

  - job_name: alertmanager
    static_configs:
      - targets: ["alertmanager:9093"]
        labels:
          service: alertmanager

  # Внешний чёрный ящик: проверяем доступность приложения и Grafana как пользователь.
  - job_name: blackbox-http
    metrics_path: /probe
    params:
      module: [http_2xx]
    static_configs:
      - targets:
          - http://app:8080/healthz
          - http://grafana:3000/api/health
        labels:
          env: local
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: service
        replacement: blackbox
      - target_label: __address__
        replacement: blackbox-exporter:9115
