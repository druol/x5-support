groups:
  - name: orbita-availability
    rules:
      - alert: TargetDown
        expr: up == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "Скрейп-цель {{ $labels.job }} недоступна"
          description: "{{ $labels.instance }} не отвечает больше 2 минут."

      - alert: HttpProbeFailing
        expr: probe_success == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "HTTP-проба {{ $labels.instance }} падает"
          description: "Пользовательский сценарий недоступен: {{ $labels.instance }}."

      - alert: PostgresDown
        expr: pg_up == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "Postgres недоступен"
          description: "Postgres-exporter не может подключиться к базе."

      - alert: RedisDown
        expr: redis_up == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "Redis недоступен"
          description: "Redis-exporter не может подключиться к Redis."

  - name: orbita-performance
    rules:
      - alert: HighErrorRate
        expr: |
          sum(rate(caddy_http_response_duration_seconds_count{handler="file_server",code=~"5.."}[5m]))
            /
          sum(rate(caddy_http_response_duration_seconds_count{handler="file_server"}[5m])) > 0.05
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Доля 5xx выше 5%"
          description: "За последние 5 минут сервер отдаёт слишком много ошибок."

      - alert: AppLatencyHigh
        expr: |
          histogram_quantile(0.95, sum by (le) (rate(caddy_http_request_duration_seconds_bucket{handler="file_server"}[5m]))) > 0.5
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "p95 латентности выше 500 мс"
          description: "Приложение отвечает медленно."

      - alert: ContainerMemoryHigh
        expr: |
          sum by (container_label_com_docker_compose_service) (
            container_memory_working_set_bytes{container_label_com_docker_compose_service!=""}
          )
            /
          sum by (container_label_com_docker_compose_service) (
            container_spec_memory_limit_bytes{container_label_com_docker_compose_service!=""} > 0
          ) > 0.9
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Контейнер {{ $labels.container_label_com_docker_compose_service }} у лимита памяти"
          description: "Потребление памяти превысило 90% лимита."

  - name: orbita-host
    rules:
      - alert: DiskSpaceLow
        expr: |
          node_filesystem_avail_bytes{mountpoint="/",fstype!~"tmpfs|overlay"}
            /
          node_filesystem_size_bytes{mountpoint="/",fstype!~"tmpfs|overlay"} < 0.15
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "На диске меньше 15% свободного места"
          description: "Освободите место, иначе контейнеры могут перестать писать данные."
