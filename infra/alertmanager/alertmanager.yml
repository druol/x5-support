global:
  resolve_timeout: 5m

route:
  receiver: default
  group_by: [alertname, job, service]
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h
  routes:
    - matchers:
        - severity = critical
      receiver: default
      repeat_interval: 1h

receivers:
  - name: default
