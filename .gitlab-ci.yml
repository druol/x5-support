# ─────────────────────────────────────────────────────────────────────────────
# CI/CD: GitLab и runner живут локально, сервер — только цель деплоя.
#   check   — типы + сборка статики
#   build   — сборка Docker-образа через локальный docker.sock
#   deploy  — ручной: rsync кода на сервер + docker compose up -d --build
# ─────────────────────────────────────────────────────────────────────────────

stages:
  - lint
  - test
  - check
  - build
  - deploy

variables:
  PNPM_VERSION: "9.15.9"
  APP_IMAGE: "orbita-dashboard:$CI_COMMIT_SHORT_SHA"

default:
  interruptible: true

# 1. Линтер + проверка типов.
lint:
  stage: lint
  image: node:22-alpine
  before_script:
    - corepack enable
    - corepack prepare pnpm@$PNPM_VERSION --activate
    - cd frontend
    - pnpm install --frozen-lockfile
  script:
    - pnpm lint
    - pnpm typecheck

# 2. Юнит-тесты (Vitest).
test:
  stage: test
  image: node:22-alpine
  before_script:
    - corepack enable
    - corepack prepare pnpm@$PNPM_VERSION --activate
    - cd frontend
    - pnpm install --frozen-lockfile
  script:
    - pnpm test

# 3. Сборка статики.
check:
  stage: check
  image: node:22-alpine
  before_script:
    - corepack enable
    - corepack prepare pnpm@$PNPM_VERSION --activate
    - cd frontend
    - pnpm install --frozen-lockfile
  script:
    - pnpm build
  artifacts:
    paths:
      - frontend/dist
    expire_in: 1 week

# 3. Сборка Docker-образа приложения (локально).
build-image:
  stage: build
  image: docker:27-cli
  needs: [check]
  script:
    - docker version --format 'server {{.Server.Version}}'
    - docker build -t "$APP_IMAGE" ./frontend
    - docker image inspect "$APP_IMAGE" --format 'image {{.Id}}'
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

# 4. Деплой на сервер: код → rsync → compose на сервере.
#    Нужны переменные (Settings → CI/CD → Variables):
#      DEPLOY_HOST      — IP или домен сервера
#      DEPLOY_USER      — пользователь деплоя (например, deploy)
#      DEPLOY_SSH_KEY   — приватный ключ (тип File или Variable, masked)
#      DEPLOY_PATH      — каталог на сервере (по умолчанию /opt/orbita)
#      DEPLOY_PORT      — SSH-порт (по умолчанию 22)
#    На сервере один раз создаётся .env с секретами — он НЕ перезаписывается.
deploy:
  stage: deploy
  image: alpine:3.20
  needs: [build-image]
  when: manual
  environment:
    name: production
  before_script:
    - apk add --no-cache openssh-client rsync
    - mkdir -p ~/.ssh && chmod 700 ~/.ssh
    - echo "$DEPLOY_SSH_KEY" | tr -d '\r' > ~/.ssh/id_deploy
    - chmod 600 ~/.ssh/id_deploy
    - ssh-keyscan -p "${DEPLOY_PORT:-22}" -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts 2>/dev/null
  script:
    - echo "Деплой на ${DEPLOY_USER}@${DEPLOY_HOST}:${DEPLOY_PATH:-/opt/orbita}"
    - rsync -az --delete
        --exclude '.git'
        --exclude '.env'
        --exclude 'node_modules'
        --exclude 'backups'
        --exclude 'dev-scratch'
        --exclude 'frontend/dist'
        --exclude 'certs'
        -e "ssh -p ${DEPLOY_PORT:-22} -i ~/.ssh/id_deploy"
        ./ "${DEPLOY_USER}@${DEPLOY_HOST}:${DEPLOY_PATH:-/opt/orbita}/"
    - ssh -p "${DEPLOY_PORT:-22}" -i ~/.ssh/id_deploy
        "${DEPLOY_USER}@${DEPLOY_HOST}"
        "cd ${DEPLOY_PATH:-/opt/orbita} && docker compose -f docker-compose.yml -f docker-compose.observability.yml -f docker-compose.prod.yml up -d --build && docker compose ps"
